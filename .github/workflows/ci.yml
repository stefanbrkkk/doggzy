name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Serbian Latin script
        run: npm run check:script

      - name: Colour contrast (WCAG)
        run: npm run check:contrast

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: End-to-end
        run: npm run test:e2e
        env:
          # The suite starts its own production server on this port.
          PORT: 3000
